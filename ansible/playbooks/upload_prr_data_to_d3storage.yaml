- name: Copy 'stream' folder contents to Synology guest share
  hosts: tianyi
  gather_facts: yes
  serial: 22  # Process 10 hosts at a time
  vars:
    synology_server: 192.168.10.201
    synology_share: datadump
    tianyi_dir: /data/owl_and_webcam
  tasks:
    - name: Random delay to avoid Synology collisions
      ansible.builtin.pause:
        seconds: "{{ 1 + (ansible_hostname | hash('sha256') | int(base=16) % 5) }}"
    
    - name: Upload to datadump/tianyi/raw/{{ ansible_hostname }}
      ansible.builtin.shell: |
        smbclient //{{ synology_server }}/{{ synology_share }} -N \
        -c "cd tianyi/raw; mkdir {{ ansible_hostname }}; cd {{ ansible_hostname }}; lcd {{ tianyi_dir }}; prompt; recurse; mput *"
      args:
        chdir: "{{ tianyi_dir }}"
      register: upload_result
    
    - name: Show upload result for {{ ansible_hostname }}
      ansible.builtin.debug:
        msg: "{{ ansible_hostname }} upload completed: {{ upload_result.rc == 0 }}"
